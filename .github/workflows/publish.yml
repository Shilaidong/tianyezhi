name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 4df0efbadee174805b849a9775ea5acc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tianyezhi --remote

      - name: Seed D1 from markdown
        run: npx tsx scripts/seed.ts --remote

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          OPEN_NEXT_DEPLOY: "true"
